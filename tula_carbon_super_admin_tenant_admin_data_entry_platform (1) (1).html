<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tula Carbon — Super Admin, Tenant Admin & Per-Category Data Entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F6; --panel:#FFFFFF; --ink:#12262D; --muted:#5B6E75; --line:#D5DEE1;
  --teal:#0E6B6E; --teal-d:#0A5254; --teal-soft:#DCEFEF;
  --amber:#8A5A00; --amber-soft:#FBF0D9; --amber-line:#E3B655;
  --red:#A4322A; --red-soft:#F8E1DD; --green:#25693F; --green-soft:#DDF0E4;
  --indigo:#2B4C7E; --indigo-soft:#E3ECF7;
  --purple:#5B3A7D; --purple-soft:#EFE8F7;
  --r:8px;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1B8FBF;outline-offset:2px}

/* Top Bar */
.top{background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:12px 24px;position:sticky;top:0;z-index:30}
.brand{font-weight:700;font-size:17px;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
.brand-dot{width:10px;height:10px;border-radius:50%;background:#35B8BD;display:inline-block}
.brand small{font-weight:400;opacity:.75;font-size:13px}
.role-tabs{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;gap:4px;margin-left:12px}
.role-tab{background:transparent;border:0;color:#CFE3E5;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.role-tab:hover{color:#fff}
.role-tab.active{background:#fff;color:var(--ink)}
.role-tab.super.active{background:#F5C249;color:var(--ink)}
.badges{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.badge{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 12px;font-size:12.5px}
.badge.on{background:#fff;color:var(--ink);border-color:#fff;font-weight:600}
.badge.super{background:#FBF0D9;color:var(--amber);border-color:#E3B655;font-weight:700}
.badge.tenant{background:#DCEFEF;color:var(--teal-d);border-color:#8FB3B5;font-weight:700}
.badge.operator{background:#EFE8F7;color:var(--purple);border-color:#C7B3DF;font-weight:700}
.badge.lock{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line);font-weight:600}
.link{background:none;border:0;color:#CFE3E5;text-decoration:underline;cursor:pointer;padding:2px 4px;font-size:13px}

/* Layout */
.app{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;max-width:1540px;margin:0 auto;padding:24px 24px 70px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px}
h1{font-size:23px;line-height:1.25;margin:0 0 6px}
h2{font-size:17px;margin:22px 0 8px}
h3{font-size:15.5px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 20px;max-width:78ch}

/* Subnav Tabs */
.subnav{display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px}
.subtab{background:var(--paper);border:1px solid var(--line);color:var(--ink);padding:7px 14px;border-radius:6px;font-size:13.5px;font-weight:600;cursor:pointer}
.subtab:hover{border-color:var(--teal)}
.subtab.active{background:var(--teal);border-color:var(--teal);color:#fff}

/* Login Gateway */
.login-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-top:16px}
.login-card{border:2px solid var(--line);border-radius:10px;padding:22px;background:#fff;display:flex;flex-direction:column;gap:14px}
.login-card.super-card{border-top:5px solid #D99B16}
.login-card.tenant-card{border-top:5px solid var(--teal)}
.login-card.op-card{border-top:5px solid var(--purple)}
.role-pill{display:inline-block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 10px;border-radius:999px;width:fit-content}
.role-pill.super{background:var(--amber-soft);color:var(--amber)}
.role-pill.tenant{background:var(--teal-soft);color:var(--teal-d)}
.role-pill.op{background:var(--purple-soft);color:var(--purple)}

/* Banners & Alerts */
.lockbar{background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber);border-radius:var(--r);padding:10px 14px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-weight:500}
.lockbar button{margin-left:auto}
.infobar{background:var(--teal-soft);border:1px solid #9ECBCB;color:var(--teal-d);border-radius:var(--r);padding:10px 14px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13.5px}
.warnbar{background:var(--red-soft);border:1px solid #E3A9A1;color:var(--red);border-radius:var(--r);padding:10px 14px;margin-bottom:18px;font-size:13.5px;font-weight:500}

/* Forms */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px 20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px 18px}
label.f{display:block;font-weight:600;font-size:13.5px;margin-bottom:4px}
.hint{display:block;font-weight:400;color:var(--muted);font-size:12px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=file],select{width:100%;padding:8px 10px;border:1px solid #AEBCC1;border-radius:6px;background:#fff;min-height:38px}
input[type=file]{padding:5px 8px;font-size:13px;cursor:pointer}
input:disabled,select:disabled{background:#EDF1F2;color:#7B8B91;cursor:not-allowed}
.err{color:var(--red);font-size:13px;margin-top:4px;min-height:1px}
.row-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.row-actions .sp{flex:1}

/* Buttons */
.btn{border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:6px;padding:8px 16px;font-weight:600;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover:not(:disabled){background:var(--teal-d)}
.btn.sec{background:#fff;color:var(--teal-d)}
.btn.sec:hover:not(:disabled){background:var(--teal-soft)}
.btn.amber{background:#B87A00;border-color:#B87A00;color:#fff}
.btn.amber:hover:not(:disabled){background:#946200}
.btn.purple{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.purple:hover:not(:disabled){background:#462B62}
.btn.sm{padding:5px 11px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{background:none;border:1px solid transparent;color:var(--red);cursor:pointer;border-radius:6px;padding:4px 8px;font-size:13px}
.iconbtn:hover{background:var(--red-soft)}
.iconbtn:disabled{opacity:.4;cursor:not-allowed}

/* Approach Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{position:relative;border:2px solid var(--line);border-radius:10px;padding:16px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:#8FB3B5}
.card input{position:absolute;opacity:0;inset:0;cursor:pointer}
.card:has(input:checked){border-color:var(--teal);background:#F5FBFB;box-shadow:0 0 0 1px var(--teal)}
.card h3{margin:0;font-size:17px}
.card p{margin:0;color:var(--muted);font-size:13.5px}
.viz{display:flex;gap:10px;padding:10px;background:var(--paper);border-radius:8px;justify-content:space-between}
.viz figure{margin:0;text-align:center;flex:1}
.viz figcaption{font-size:11px;color:var(--muted);line-height:1.25;margin-top:4px}
.viz b{display:block;font-size:13px;color:var(--ink)}

/* Summary Chips */
.sumrow{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}
.chip{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 13px;font-size:13px}
.chip b{font-weight:700}
.chip.bad{background:var(--red-soft);border-color:#E3A9A1;color:var(--red)}
.chip.s1{background:#E8F4F4;border-color:#9ECBCB;color:var(--teal-d)}
.chip.s2{background:#E3ECF7;border-color:#A5C0E5;color:var(--indigo)}
.chip.s3{background:#FBF0D9;border-color:#E3B655;color:var(--amber)}

/* Tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:#E8EEF0;text-align:left;padding:8px 8px;font-weight:600;white-space:nowrap;border-bottom:1px solid var(--line);vertical-align:bottom}
th.cond{background:var(--amber-soft);border-bottom:2px solid var(--amber-line)}
th.auto{background:#EEF1F2;color:var(--muted);font-style:italic}
th small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
td{padding:6px 8px;border-bottom:1px solid #E6ECEE;vertical-align:middle}
td input[type=text],td input[type=number],td select{min-height:34px;padding:5px 8px;font-size:13.5px}
td.ro{background:#F6F8F9;color:#3E5159}
.chk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding:4px 8px;border:1px solid #AEBCC1;border-radius:999px;background:#fff;font-size:13px;white-space:nowrap}
.chk input{margin:0;width:15px;height:15px;accent-color:var(--teal)}
.chk:has(input:checked){background:var(--teal-soft);border-color:var(--teal);font-weight:600}
.chk:has(input:disabled){opacity:.6;cursor:not-allowed}
.pct{font-weight:700;text-align:right;white-space:nowrap}
.st{font-weight:600;font-size:12.5px;white-space:nowrap}
.st.ok{color:var(--green)} .st.no{color:var(--red)}
.empty{padding:32px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15.5px;margin-bottom:4px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 0;align-items:center}

/* Badges & Tags */
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--paper);border:1px solid var(--line);white-space:nowrap}
.tag.s1{background:#E8F4F4;color:var(--teal-d);border-color:#9ECBCB}
.tag.s2{background:#E3ECF7;color:var(--indigo);border-color:#A5C0E5}
.tag.s3{background:#FBF0D9;color:var(--amber);border-color:#E3B655}
.tag.perm{background:#DDF0E4;color:var(--green);border-color:#9FD3B2}
.tag.perm.off{background:#F2F5F6;color:var(--muted);border-color:var(--line);text-decoration:line-through}
.tag.op{background:var(--purple-soft);color:var(--purple);border-color:#C7B3DF}
.tag.ai{background:#E6F4F1;color:var(--teal-d);border-color:#8CC5C7}
.tag.site{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.tag.supp{background:var(--indigo-soft);color:var(--indigo);border-color:#A5C0E5}
.tag.match-ok{background:#DDF0E4;color:var(--green);border-color:#9FD3B2}
.tag.match-warn{background:#FBF0D9;color:var(--amber);border-color:#E3B655}
.tag.match-bad{background:#F8E1DD;color:var(--red);border-color:#E3A9A1}

/* Modal for Scope Categories & Methods */
.modal-backdrop{position:fixed;inset:0;background:rgba(18,38,45,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal-backdrop[hidden]{display:none}
.modal{background:#fff;border-radius:10px;border:1px solid var(--line);max-width:1100px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 45px rgba(0,0,0,.25)}
.modal-head{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.modal-head h2{margin:0;font-size:18.5px}
.modal-nav{padding:10px 24px;background:#F4F7F8;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex-shrink:0}
.m-pill{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.m-pill:hover{border-color:var(--teal)}
.m-pill.active{background:var(--teal);border-color:var(--teal);color:#fff}
.modal-body{padding:20px 24px;overflow-y:auto;display:block;flex:1 1 auto;min-height:0}
.modal-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--paper);border-radius:0 0 10px 10px;flex-shrink:0}
.scope-box{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:20px;background:#fff}
.scope-box:last-child{margin-bottom:0}
.scope-box-head{background:#E8EEF0;padding:11px 16px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
.scope-box-head.s2h{background:var(--indigo-soft);color:var(--indigo)}
.scope-box-head.s3h{background:var(--amber-soft);color:var(--amber)}
.cat-group-hdr{padding:7px 16px;background:#FBF7EE;border-bottom:1px solid #EFE4CC;font-size:12px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.4px}
.cat-cols-hdr{display:grid;grid-template-columns:minmax(260px,1.7fr) minmax(240px,1fr);gap:14px;padding:7px 16px;background:#F4F7F8;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.cat-list{display:block}
.cat-row{display:grid;grid-template-columns:minmax(260px,1.7fr) minmax(240px,1fr);gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid #EDF1F2;font-size:13.5px;background:#fff}
.cat-row:last-child{border-bottom:0}
.cat-row:hover{background:#F8FAFB}
.cat-row.disabled-cat{background:#FAFBFB}
.cat-row.disabled-cat .cat-left{opacity:.72}
.cat-left{display:flex;align-items:flex-start;gap:10px;cursor:pointer;line-height:1.4}
.cat-left input{margin-top:3px;width:16px;height:16px;accent-color:var(--teal);flex:none}
.cat-row select{min-height:34px;padding:5px 8px;font-size:13px;width:100%}

/* Data Entry Workspace */
.de-layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
.cat-nav{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cat-nav-group{border-bottom:1px solid var(--line)}
.cat-nav-group:last-child{border-bottom:0}
.cat-nav-title{padding:9px 14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:#E8EEF0;color:var(--ink)}
.cat-nav-item{width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #F0F4F5;padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.cat-nav-item:hover{background:#F5FBFB}
.cat-nav-item.active{background:var(--teal-soft);color:var(--teal-d);font-weight:700;border-left:4px solid var(--teal)}
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi-card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi-card .k-lbl{font-size:12px;color:var(--muted)}
.kpi-card .k-val{font-size:19px;font-weight:700;color:var(--ink);margin-top:2px}
.kpi-card.hi{background:var(--teal-soft);border-color:#9ECBCB}
.kpi-card.hi .k-val{color:var(--teal-d)}
.kpi-card.mkt{background:var(--indigo-soft);border-color:#A5C0E5}
.kpi-card.mkt .k-val{color:var(--indigo)}
.calc-preview{background:var(--teal-soft);border:1px solid #9ECBCB;border-radius:8px;padding:12px 16px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}
.dropzone{border:2px dashed #9AB0B6;border-radius:8px;padding:16px;text-align:center;background:#F8FAFB;margin-top:14px}
.ai-box{background:#F4FAFA;border:1px solid #B7DCDD;border-radius:8px;padding:12px 14px;margin-top:14px}
.site-calc-box{background:#FDF9F1;border:1px solid #E3B655;border-radius:8px;padding:14px;margin-top:14px}
.supp-box{background:#F3F7FC;border:1px solid #A5C0E5;border-radius:8px;padding:14px;margin-top:14px}
.ev-link{color:var(--teal-d);font-weight:600;text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font-size:12.5px}
.ev-link:hover{color:var(--teal)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:8px;z-index:60;max-width:90vw;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:960px){
  .de-layout{grid-template-columns:1fr}
  .cat-cols-hdr{display:none}
  .cat-row{grid-template-columns:1fr;gap:8px}
  .app{padding:16px}
  .panel{padding:18px}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="brand-dot"></span>
    <span>Tula Carbon<small id="roleSub">Login Gateway</small></span>
    <div class="role-tabs" id="roleSwitcher">
      <button type="button" class="role-tab" data-mode="login">Login Gateway</button>
      <button type="button" class="role-tab super" data-mode="super">Super Admin</button>
      <button type="button" class="role-tab" data-mode="tenant">Tenant Admin</button>
      <button type="button" class="role-tab" data-mode="operator">Data Entry Operator</button>
    </div>
  </div>
  <div class="badges" id="badges"></div>
</header>

<div class="app">
  <main id="view" tabindex="-1"></main>
</div>

<!-- Modal: Add / Configure Facility, Scopes, GHG Categories & Methods (Tenant Admin Only) -->
<div class="modal-backdrop" id="catModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="catModalTitle">
    <div class="modal-head">
      <div>
        <h2 id="catModalTitle">Configure Facility, GHG Protocol Categories &amp; Calculation Methods</h2>
        <div class="hint" id="catModalSub">Navigate across Scope 1, Scope 2, and Scope 3 below to tick applicable GHG Protocol categories and choose their calculation methods.</div>
      </div>
      <button type="button" class="btn sec sm" id="closeCatModal">Done</button>
    </div>
    <div class="modal-nav" id="catModalNav"></div>
    <div class="modal-body" id="catModalBody"></div>
    <div class="modal-foot">
      <button type="button" class="btn" id="saveCatModal">Save Facility &amp; Category Configuration</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";

/* ---------- Master Reference Data ---------- */
const COUNTRIES = ["India","Kenya","Nigeria","South Africa","Egypt","Ghana","United States","United Kingdom","Germany","France","Netherlands","Australia","Canada","Singapore","United Arab Emirates","Japan","China","Brazil"];
const GRIDS = [
  {name:"India - National Average", ef:0.716},
  {name:"India - Northern Grid", ef:0.742},
  {name:"India - Western Grid", ef:0.735},
  {name:"India - Southern Grid", ef:0.688},
  {name:"India - Eastern Grid", ef:0.810},
  {name:"India - North-Eastern Grid", ef:0.615},
  {name:"UK - DEFRA", ef:0.207},
  {name:"eGRID - CAMX", ef:0.225},
  {name:"eGRID - ERCT", ef:0.371},
  {name:"Kenya - National Grid", ef:0.112},
  {name:"South Africa - National Grid", ef:0.928},
  {name:"IEA - Country Average", ef:0.450}
];

const FRAMEWORKS = [
  "GHG Protocol Corporate Standard",
  "BRSR Core (SEBI India)",
  "CSRD / ESRS E1 (EU)",
  "ISO 14064-1:2018"
];

const PERIOD_MONTHS = [
  "2025-04 (Apr 2025)","2025-05 (May 2025)","2025-06 (Jun 2025)",
  "2025-07 (Jul 2025)","2025-08 (Aug 2025)","2025-09 (Sep 2025)",
  "2025-10 (Oct 2025)","2025-11 (Nov 2025)","2025-12 (Dec 2025)",
  "2026-01 (Jan 2026)","2026-02 (Feb 2026)","2026-03 (Mar 2026)"
];

const ACTIVITY_UNITS = [
  "Liters","m3","kg","tonnes","kWh","MWh","GJ","km","tonne-km","passenger-km","USD","INR","units","room-nights","FTE-days","hectares"
];

const APPROACHES = {
  "Equity Share": {
    code:"EQUITY", field:"Equity Share %",
    lead:"Consolidate emissions in proportion to equity ownership percentage.",
    viz:[["Subsidiary","80% owned",80],["Joint venture","operated",50],["Minority stake","25% owned",25]]
  },
  "Operational Control": {

/* ---------- Unit Normalization & Matching Helper ---------- */
function normUnit(u){
  let s = String(u||"").trim().toLowerCase();
  s = s.replace(/^kg\s*co2e\s*\/\s*/i, "");
  const aliases = {
    "l":"liters","liter":"liters","litres":"liters","litre":"liters","liters":"liters",
    "m^3":"m3","cbm":"m3","cubic meter":"m3","cubic meters":"m3","m3":"m3",
    "kilogram":"kg","kilograms":"kg","kgs":"kg","kg":"kg",
    "t":"tonnes","ton":"tonnes","tons":"tonnes","tonne":"tonnes","mt":"tonnes","tonnes":"tonnes",
    "kwh":"kwh","mwh":"mwh","gj":"gj",
    "kilometer":"km","kilometers":"km","kms":"km","km":"km",
    "tkm":"tonne-km","t-km":"tonne-km","tonne-km":"tonne-km","ton-km":"tonne-km",
    "pkm":"passenger-km","pax-km":"passenger-km","passenger-km":"passenger-km",
    "usd":"usd","$":"usd","inr":"inr","₹":"inr",
    "unit":"units","units":"units",
    "night":"room-nights","nights":"room-nights","room-night":"room-nights","room-nights":"room-nights",
    "fte-day":"fte-days","fte-days":"fte-days",
    "ha":"hectares","hectare":"hectares","hectares":"hectares"
  };
  return aliases[s] || s;
}

function resolveUnitMatch(actUnitRaw, efUnitRaw){
  const a = normUnit(actUnitRaw);
  const e = normUnit(efUnitRaw);
  if(!a || !e) return { status:"mismatch", factor:1, label:"Missing unit" };
  if(a === e) return { status:"exact", factor:1, label:`Exact Match (${actUnitRaw} = kgCO2e/${e})` };

  const pairs = {
    "kg->tonnes": 0.001,
    "tonnes->kg": 1000,
    "kwh->mwh": 0.001,
    "mwh->kwh": 1000,
    "mwh->gj": 3.6,
    "gj->mwh": 1/3.6,
    "kwh->gj": 0.0036,
    "gj->kwh": 1000/3.6,
    "liters->m3": 0.001,
    "m3->liters": 1000
  };
  const key = `${a}->${e}`;
  if(pairs[key] != null){
    return { status:"converted", factor:pairs[key], label:`Auto-Converted (${actUnitRaw} × ${pairs[key]} -> ${e})` };
  }
  return { status:"mismatch", factor:1, label:`Unit Mismatch: Activity is "${actUnitRaw}" but EF is per "${e}"` };
}

function getDefaultEfMeta(catId, fac){

  }

}

/**
 * 3-Tier Emission Factor Calculation Engine:
 * Tier 1 ("default"): Uses Tula AI Suggested Default EF
 * Tier 2 ("site_calc"): Calculates Site-Specific EF from Density & NCV:
 *   - If BOTH Density and NCV are entered -> uses both
 *   - If ONLY Density is entered -> uses entered Density + Default NCV
 *   - If ONLY NCV is entered -> uses Default Density + entered NCV
 *   - If NEITHER Density nor NCV is entered -> falls back to Default Tula AI Suggested EF
 * Tier 3 ("supplier"): Uses Direct Supplier-Specific EF entered by user
 */
function computeEffectiveEF(tier, catId, fac, opts){
  const meta = getDefaultEfMeta(catId, fac);
  const baseDefEf = meta.ef;
  const defDens = meta.defDensity || 0.835;
  const defNcv = meta.defNcv || 43.0;
  // Energy-specific emission factor (kgCO2e / MJ) derived from default EF, density & NCV
  const efPerMj = baseDefEf / (defDens * defNcv);

  if(tier === "supplier"){
    const supEf = Number(opts.supplierEf);
    return {
      ef: isNaN(supEf) || supEf < 0 ? 0 : supEf,
      unit: opts.supplierEfUnit || meta.unit,
      sourceTag: "Supplier-Specific Direct EF",
      detail: `Direct Supplier PCF / Utility EF (${opts.supplierName || "Verified Supplier"})`
    };
  }

  if(tier === "site_calc"){
    const hasDens = opts.density !== "" && opts.density != null && !isNaN(Number(opts.density)) && Number(opts.density) > 0;
    const hasNcv  = opts.ncv !== "" && opts.ncv != null && !isNaN(Number(opts.ncv)) && Number(opts.ncv) > 0;

    if(!hasDens && !hasNcv){
      return {
        ef: baseDefEf,
        unit: meta.unit,
        sourceTag: "Fallback: Tula AI Default EF",
        detail: `Neither Density nor NCV entered -> fell back to ${meta.source} (${baseDefEf} kgCO2e/${meta.unit})`
      };
    }

    const usedDens = hasDens ? Number(opts.density) : defDens;
    const usedNcv  = hasNcv  ? Number(opts.ncv)     : defNcv;
    const calcEf   = usedDens * usedNcv * efPerMj;

    const densNote = hasDens ? `Site Density: ${usedDens} kg/unit` : `Default Density: ${defDens} kg/unit`;
    const ncvNote  = hasNcv  ? `Site NCV: ${usedNcv} MJ/kg`      : `Default NCV: ${defNcv} MJ/kg`;

    return {
      ef: Number(calcEf.toFixed(6)),
      unit: meta.unit,
      sourceTag: (hasDens && hasNcv) ? "Site-Specific (Density + NCV)" : "Hybrid Site EF (Partial Default)",
      detail: `${densNote} & ${ncvNote} -> ${calcEf.toFixed(4)} kgCO2e/${meta.unit}`
    };
  }

  // Default / Tula AI Suggested
  return {
    ef: baseDefEf,
    unit: meta.unit,
    sourceTag: "Default / Tula AI Suggested",
    detail: `${meta.source} (${baseDefEf} kgCO2e/${meta.unit})`
  };
}

}

/* Returns combined list of assignable actors: Tenant Admin (Self) + Data Entry Operators */
function getAllAssignableActors(t){
  return [
    { id: SELF_ADMIN_ID, name: `${t.tenantAdmin.name} (Tenant Admin — Self)`, dept: "Tenant Admin", email: t.tenantAdmin.email, isSelf: true },
    ...t.users.map(u => ({ id: u.id, name: u.name, dept: u.dept, email: u.email, isSelf: false }))
  ];
}

function actorNameById(t, uid){
  if(!uid) return "Unassigned";
  if(uid === SELF_ADMIN_ID) return `${t.tenantAdmin.name} (Admin)`;
  const u = t.users.find(x=>x.id===uid);
  return u ? u.name : "Unassigned";
}

function getActiveCategoryIds(f){
  const list = [];
  if(f.s1) (f.s1Cats||[]).forEach(id=>list.push({scope:"S1", id}));
  if(f.s2) (f.s2Cats||[]).forEach(id=>list.push({scope:"S2", id}));
  if(f.s3) (f.s3Cats||[]).forEach(id=>list.push({scope:"S3", id}));
  return list;
}

function getFacilityAssignedCatsForActor(f, actorId){
  const catOps = f.catOperators || {};
  return getActiveCategoryIds(f).filter(item => catOps[item.id] === actorId);
}

/* Evidence File Download / Preview Helper */
function openEvidenceFile(t, entryId){
  const e = t.entries.find(x=>x.id===entryId);
  if(!e || !e.evidenceFile){ toast("No evidence file attached to this record."); return; }
  const ev = e.evidenceFile;
  if(ev.dataUrl){
    const a = document.createElement("a");
    a.href = ev.dataUrl;
    a.download = ev.name || "evidence_document";
    a.click();
    toast("Downloading attached evidence: " + ev.name);
  } else {
    const content = `TULA CARBON — AUDIT EVIDENCE RECORD\n====================================\nOrganization: ${t.name}\nFacility ID: ${e.facilityId}\nScope / Category: ${e.scope} (${e.catId})\nActivity Name: ${e.source}\nPeriod Month: ${e.period}\nActivity Data: ${e.qty} ${e.unit}\nEmission Factor: ${e.ef} kgCO2e/${e.efUnit||e.unit} [${e.efSource||"Default"}]\nUnit Match: ${e.unitMatch||"Exact Match"}\nCalculated Emissions: ${fmtNum(e.tco2e)} tCO2e\nEvidence Reference: ${e.notes||"N/A"}\nAttached Filename: ${ev.name}\nLogged By: ${e.enteredBy}\n`;
    const blob = new Blob([content], {type:"text/plain;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = ev.name || "Audit_Evidence.txt";
    a.click();
    toast("Downloaded evidence certificate: " + ev.name);
  }
}

/* ---------- Tenant Validation & Consolidation Logic ---------- */
function approachField(t){ return t.approach ? APPROACHES[t.approach].field : ""; }
function missingField(t, f){
  if(t.approach==="Equity Share") return f.equity===""||f.equity==null;
  if(t.approach==="Operational Control") return !f.op;
  if(t.approach==="Financial Control") return !f.fin;
  return false;
}
function inclusion(t, f){
  if(!t.approach) return null;
  if(t.approach==="Equity Share"){ if(f.equity===""||f.equity==null||isNaN(Number(f.equity))) return null; return Number(f.equity)/100; }
  const v = t.approach==="Operational Control"?f.op:f.fin;
  if(!v) return null; return v==="Yes"?1:0;
}
function statusOf(t, f){
  const id=normId(f.id);
  if(!id) return "Missing Facility ID";
  if(!ID_RE.test(id)) return "Invalid Facility ID";
  if(t.facilities.filter(x=>normId(x.id)===id).length>1) return "Duplicate Facility ID";
  const nm=String(f.name||"").trim();
  if(!nm||!f.country) return "Missing required field";
  if(nm.length>120) return "Name too long";
  if(BAD_START.test(nm)) return "Invalid name prefix";
  if(!f.s1&&!f.s2&&!f.s3) return "Select >= 1 scope";
  if(f.s2&&!f.grid) return "Missing Grid Location";
  if(t.approach==="Equity Share"){
    if(missingField(t, f)) return "Missing Equity Share %";
    const q=Number(f.equity); if(isNaN(q)||q<0||q>100) return "Equity 0-100%";
  } else if(missingField(t, f)) return "Missing "+approachField(t);
  return "OK";
}
function tenantStats(t){
  const a=t.facilities, st=a.map(f=>statusOf(t,f)), inc=a.map(f=>inclusion(t,f));
  return {
    n:a.length, issues:st.filter(x=>x!=="OK").length,
    s1:a.filter(f=>f.s1).length, s2:a.filter(f=>f.s2).length, s3:a.filter(f=>f.s3).length,
    full:inc.filter(x=>x===1).length, part:inc.filter(x=>x!=null&&x>0&&x<1).length, out:inc.filter(x=>x===0).length
  };
}

function setMode(mode){
  S.mode = mode;

function renderShell(){
  const t = activeTenant();

    btn.classList.toggle("active", btn.dataset.mode===S.mode);

  };

    parts.push(`<span class="badge tenant">Tenant Admin: ${esc(t.tenantAdmin.name)}</span>`);

    if(t.lock) parts.push(`<span class="badge lock">Locked v${t.lock.version}</span>`);
  } else if(S.mode === "operator"){
    const opUser = t.users.find(u=>u.id===S.activeOpUserId) || t.users[0];
    parts.push(`<span class="badge operator">Operator: ${esc(opUser?opUser.name:"Unassigned")}</span>`);
    parts.push(`<span class="badge on">${esc(t.name)}</span>`);
  } else {
    parts.push(`<span class="badge">Platform v3.3</span>`);
  }
  parts.push(`<button class="link" id="reset" type="button">Reset demo data</button>`);
  $("#badges").innerHTML = parts.join("");

    if(confirm("Reset all demo organizations, facilities, category assignments, and activity records?")){

      save();
      render();
      toast("Demo data restored to default.");
    }
  };
}

}

        <p class="hint" style="font-size:13.5px">Add facilities and tick each applicable category under Scope 1 (7 categories), Scope 2 (2 categories), and Scope 3 (15 categories).</p>
      </div>
      <div style="display:flex;gap:8px">
        <button type="button" class="btn sm" id="taAddFac" ${canFac?"":"disabled"}>+ Add Facility &amp; Select Categories</button>
      </div>
    </div>

    <div class="sumrow">
      <span class="chip"><b>${k.n}</b> facilities</span>
      <span class="chip s1"><b>${k.s1}</b> Scope 1</span>
      <span class="chip s2"><b>${k.s2}</b> Scope 2</span>
      <span class="chip s3"><b>${k.s3}</b> Scope 3</span>
      <span class="chip"><b>${k.full}</b> 100% counted</span>
      <span class="chip"><b>${k.part}</b> partial</span>
      <span class="chip ${k.issues?"bad":""}"><b>${k.issues}</b> validation issues</span>
    </div>

    ${!t.facilities.length ? `<div class="tablewrap"><div class="empty"><b>No facilities added yet</b>Click "+ Add Facility &amp; Select Categories" above to add a facility and tick applicable Scope 1, 2 &amp; 3 categories.</div></div>` : `
    <div class="tablewrap">
      <table style="min-width:1180px">
        <thead>
          <tr>
            <th>Facility ID</th>
            <th>Facility Name</th>
            <th>Country</th>
            <th>Grid Location<small>If Scope 2 active</small></th>
            <th class="cond">${esc(fld)}<small>${t.approach==="Equity Share"?"0–100%":"Yes/No"}</small></th>
            <th>Applicable GHG Categories &amp; Methods</th>
            <th class="auto">Share</th>
            <th class="auto">Status</th>
            <th><span class="sr">Remove</span></th>
          </tr>
        </thead>
        <tbody>
          ${t.facilities.map((f,i)=>{
            const st = statusOf(t, f);
            const inc = inclusion(t, f);
            const s1n = f.s1 ? (f.s1Cats||[]).length : 0;
            const s2n = f.s2 ? (f.s2Cats||[]).length : 0;
            const s3n = f.s3 ? (f.s3Cats||[]).length : 0;
            let ctrl = "";
            if(t.approach==="Equity Share"){
              ctrl = `<input type="number" min="0" max="100" step="0.01" data-i="${i}" data-f="equity" value="${esc(f.equity)}" ${canFac?"":"disabled"} style="width:82px">`;
            } else {
              const key = t.approach==="Operational Control"?"op":"fin";
              ctrl = `<select data-i="${i}" data-f="${key}" ${canFac?"":"disabled"} style="width:84px">
                <option value="">Select</option>
                <option ${f[key]==="Yes"?"selected":""}>Yes</option>
                <option ${f[key]==="No"?"selected":""}>No</option>
              </select>`;
            }
            return `<tr>
              <td><input type="text" data-i="${i}" data-f="id" value="${esc(f.id)}" maxlength="20" ${canFac?"":"disabled"} style="width:124px"></td>
              <td><input type="text" data-i="${i}" data-f="name" value="${esc(f.name)}" maxlength="120" ${canFac?"":"disabled"} style="min-width:185px"></td>
              <td><select data-i="${i}" data-f="country" ${canFac?"":"disabled"} style="min-width:125px">
                ${COUNTRIES.map(c=>`<option ${c===f.country?"selected":""}>${esc(c)}</option>`).join("")}
              </select></td>
              <td><select data-i="${i}" data-f="grid" ${(!canFac||!f.s2)?"disabled":""} style="min-width:180px">
                <option value="">${f.s2?"Select grid":"Not needed"}</option>
                ${GRIDS.map(g=>`<option ${g.name===f.grid?"selected":""}>${esc(g.name)}</option>`).join("")}
              </select></td>
              <td>${ctrl}</td>
              <td>
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                  <button type="button" class="btn sec sm" data-cfg="${i}">
                    Select Categories &amp; Methods (${s1n+s2n+s3n})
                  </button>
                  <div style="font-size:12px">
                    ${s1n?`<span class="tag s1">Scope 1: ${s1n}/7</span> `:""}
                    ${s2n?`<span class="tag s2">Scope 2: ${s2n}/2 (${methodShort(f.s2Method)})</span> `:""}
                    ${s3n?`<span class="tag s3">Scope 3: ${s3n}/15</span>`:""}
                    ${(!s1n&&!s2n&&!s3n)?`<span class="hint">None ticked yet</span>`:""}
                  </div>
                </div>
              </td>
              <td class="pct ro">${esc(pctText(inc))}</td>
              <td class="ro"><span class="st ${st==="OK"?"ok":"no"}">${esc(st)}</span></td>
              <td><button type="button" class="iconbtn" data-del="${i}" ${canFac?"":"disabled"} title="Remove facility">&#10005;</button></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>`}

    <div class="row-actions">
      <button type="button" class="btn sec" id="taGoUsers">Next: Assign Operators / Self to Facilities &amp; Categories &rarr;</button>
      <span class="sp"></span>
      <button type="button" class="btn" id="taGoDataEntry">Fill Facility Activity Data (Admin) &rarr;</button>
    </div>
  `;

  $$("input[name=taAppr]", box).forEach(r=>r.onchange=()=>{ t.approach = r.value; save(); render(); });

  if($("#taAddFac")){
    $("#taAddFac").onclick = ()=>{
      const num = String(t.facilities.length + 1).padStart(4,"0");
      t.facilities.push({
        id: "FAC-IN-" + num,
        name: "New Facility " + (t.facilities.length + 1),
        country: "India",
        grid: "India - National Average",
        equity: 100, op: "Yes", fin: "Yes",
        s1: true, s2: true, s3: true,
        s1Cats: ["S1-1"], s2Cats: ["S2-1"], s3Cats: [],
        s2Method: "S2_DUAL",
        catMethods: {"S1-1":"S1_FUEL"},
        assignedUsers: [SELF_ADMIN_ID],
        catOperators: {"S1-1": SELF_ADMIN_ID, "S2-1": SELF_ADMIN_ID}
      });
      save();
      const newIdx = t.facilities.length - 1;
      render();
      openCatModal(newIdx);
    };
  }

  $$("[data-i]", box).forEach(el=>{
    const handler = ()=>{
      const i = Number(el.dataset.i);
      const k = el.dataset.f;
      t.facilities[i][k] = el.value;
      save();
    };
    el.addEventListener(el.type==="text"||el.type==="number" ? "input" : "change", handler);
    if(el.dataset.f==="id"){
      el.addEventListener("blur", ()=>{
        const i = Number(el.dataset.i);
        t.facilities[i].id = normId(el.value);
        save();
        render();
      });
    }
  });

  $$("[data-cfg]", box).forEach(b=>b.onclick=()=>openCatModal(Number(b.dataset.cfg)));
  $$("[data-del]", box).forEach(b=>b.onclick=()=>{
    if(confirm("Remove this facility from " + t.name + "?")){
      t.facilities.splice(Number(b.dataset.del), 1);
      save();
      render();
    }
  });

  $("#taGoUsers").onclick = ()=>{ S.tenantSubTab = "users"; save(); render(); };
  $("#taGoDataEntry").onclick = ()=>{ S.tenantSubTab = "data_entry"; save(); render(); };
}

/* ---------- Modal: Facility Profile + All Scope 1, 2 & 3 GHG Protocol Categories & Methods ---------- */
let modalFacIdx = null;
function openCatModal(idx){
  modalFacIdx = idx;
  S.modalScopeTab = "ALL";
  renderCatModal();
  $("#catModal").hidden = false;
}
function renderCatModal(){
  const t = activeTenant();
  const f = t.facilities[modalFacIdx];
  if(!f) return;
  const canEdit = t.permissions.canConfigureScopes && !t.lock;
  const dis = canEdit ? "" : "disabled";
  f.catMethods = f.catMethods || {};
  f.s1Cats = f.s1Cats || [];
  f.s2Cats = f.s2Cats || [];
  f.s3Cats = f.s3Cats || [];

  const s1Count = f.s1Cats.length;
  const s2Count = f.s2Cats.length;
  const s3Count = f.s3Cats.length;
  const tab = S.modalScopeTab || "ALL";

  $("#catModalTitle").textContent = `${f.name} (${normId(f.id)}) — Facility & GHG Protocol Categories`;

  $("#catModalNav").innerHTML = `
    <span style="font-size:12px;font-weight:700;color:var(--muted);margin-right:4px">GHG Scope View:</span>
    <button type="button" class="m-pill ${tab==="ALL"?"active":""}" data-mtab="ALL">All Scopes (${s1Count+s2Count+s3Count}/24)</button>
    <button type="button" class="m-pill ${tab==="S1"?"active":""}" data-mtab="S1">Scope 1: Direct (${s1Count}/7)</button>
    <button type="button" class="m-pill ${tab==="S2"?"active":""}" data-mtab="S2">Scope 2: Purchased Energy (${s2Count}/2)</button>
    <button type="button" class="m-pill ${tab==="S3"?"active":""}" data-mtab="S3">Scope 3: Value Chain (${s3Count}/15)</button>
  `;

  let html = `
    <div class="grid3" style="background:var(--paper);padding:14px 16px;border-radius:8px;border:1px solid var(--line);margin-bottom:18px">
      <div>
        <label class="f" for="mFacId">Facility ID</label>
        <input type="text" id="mFacId" value="${esc(f.id)}" ${dis}>
      </div>
      <div>
        <label class="f" for="mFacName">Facility Name</label>
        <input type="text" id="mFacName" value="${esc(f.name)}" ${dis}>
      </div>
      <div>
        <label class="f" for="mFacCountry">Country</label>
        <select id="mFacCountry" ${dis}>
          ${COUNTRIES.map(c=>`<option ${c===f.country?"selected":""}>${esc(c)}</option>`).join("")}
        </select>
      </div>
      <div>
        <label class="f" for="mFacGrid">Electricity Grid Region</label>
        <select id="mFacGrid" ${dis}>
          <option value="">Select grid</option>
          ${GRIDS.map(g=>`<option ${g.name===f.grid?"selected":""}>${esc(g.name)}</option>`).join("")}
        </select>
      </div>
      <div>
        <label class="f" for="mFacBound">${esc(approachField(t))}</label>
        ${t.approach==="Equity Share"
          ? `<input type="number" id="mFacEquity" min="0" max="100" step="0.01" value="${esc(f.equity)}" ${dis}>`
          : `<select id="mFacCtrl" ${dis}>
              <option value="">Select</option>
              <option ${(t.approach==="Operational Control"?f.op:f.fin)==="Yes"?"selected":""}>Yes</option>
              <option ${(t.approach==="Operational Control"?f.op:f.fin)==="No"?"selected":""}>No</option>
            </select>`
        }
      </div>
    </div>
  `;

  if(tab === "ALL" || tab === "S1"){
    html += `<div class="scope-box">
      <div class="scope-box-head">
        <span>Scope 1 — Direct GHG Emissions (7 GHG Protocol / ISO 14064-1 Categories)</span>
        <div style="display:flex;gap:6px">
          <button type="button" class="btn sec sm" id="s1All" ${dis}>Tick All 7</button>
          <button type="button" class="btn sec sm" id="s1Clear" ${dis}>Clear</button>
        </div>
      </div>
      <div class="cat-cols-hdr">
        <div>GHG Protocol Category (Tick Applicable)</div>
        <div>Calculation Method</div>
      </div>
      <div class="cat-list">
        ${GHG_CATEGORIES.scope1.map(c=>{
          const chk = f.s1Cats.includes(c.id);
          const curM = f.catMethods[c.id] || "S1_FUEL";
          return `<div class="cat-row ${chk?"":"disabled-cat"}">
            <label class="cat-left">
              <input type="checkbox" data-scope="s1Cats" value="${c.id}" ${chk?"checked":""} ${dis}>
              <span><b>${c.code}:</b> ${esc(c.name)}</span>
            </label>
            <select data-cmethod="${c.id}" ${(!canEdit||!chk)?"disabled":""}>
              ${SCOPE1_METHODS.map(m=>`<option value="${m.id}" ${m.id===curM?"selected":""}>${esc(m.label)}</option>`).join("")}
            </select>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }

  if(tab === "ALL" || tab === "S2"){
    html += `<div class="scope-box">
      <div class="scope-box-head s2h">
        <span>Scope 2 — Energy Indirect GHG Emissions (2 Categories &amp; Reporting Method)</span>
        <div style="display:flex;gap:8px;align-items:center">
          <label style="font-size:12.5px;font-weight:600">Scope 2 Method:</label>
          <select id="modalS2Method" ${dis} style="min-height:32px;padding:3px 8px;font-size:12.5px;width:auto">
            ${SCOPE2_METHODS.map(m=>`<option value="${m.id}" ${m.id===(f.s2Method||"S2_DUAL")?"selected":""}>${esc(m.label)}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="cat-cols-hdr">
        <div>GHG Protocol Category (Tick Applicable)</div>
        <div>Active Reporting Method</div>
      </div>
      <div class="cat-list">
        ${GHG_CATEGORIES.scope2.map(c=>{
          const chk = f.s2Cats.includes(c.id);
          return `<div class="cat-row ${chk?"":"disabled-cat"}">
            <label class="cat-left">
              <input type="checkbox" data-scope="s2Cats" value="${c.id}" ${chk?"checked":""} ${dis}>
              <span><b>${c.code}:</b> ${esc(c.name)}</span>
            </label>
            <span class="hint">${methodLabel(f.s2Method||"S2_DUAL")}</span>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }

  if(tab === "ALL" || tab === "S3"){
    const upstreamCats = GHG_CATEGORIES.scope3.filter(c=>c.group==="Upstream");
    const downstreamCats = GHG_CATEGORIES.scope3.filter(c=>c.group==="Downstream");
    const renderS3Rows = list => list.map(c=>{
      const chk = f.s3Cats.includes(c.id);
      const curM = f.catMethods[c.id] || "S3_ACT";
      return `<div class="cat-row ${chk?"":"disabled-cat"}">
        <label class="cat-left">
          <input type="checkbox" data-scope="s3Cats" value="${c.id}" ${chk?"checked":""} ${dis}>
          <span><b>${c.code}:</b> ${esc(c.name)}</span>
        </label>
        <select data-cmethod="${c.id}" ${(!canEdit||!chk)?"disabled":""}>
          ${SCOPE3_METHODS.map(m=>`<option value="${m.id}" ${m.id===curM?"selected":""}>${esc(m.label)}</option>`).join("")}
        </select>
      </div>`;
    }).join("");

    html += `<div class="scope-box">
      <div class="scope-box-head s3h">
        <span>Scope 3 — Value Chain GHG Emissions (15 GHG Protocol Categories)</span>
        <div style="display:flex;gap:6px">
          <button type="button" class="btn sec sm" id="s3All" ${dis}>Tick All 15</button>
          <button type="button" class="btn sec sm" id="s3Clear" ${dis}>Clear</button>
        </div>
      </div>
      <div class="cat-cols-hdr">
        <div>GHG Protocol Category (Tick Applicable)</div>
        <div>Calculation Method</div>
      </div>
      <div class="cat-group-hdr">Upstream Value Chain Activities (Categories 1 – 8)</div>
      <div class="cat-list">${renderS3Rows(upstreamCats)}</div>
      <div class="cat-group-hdr">Downstream Value Chain Activities (Categories 9 – 15)</div>
      <div class="cat-list">${renderS3Rows(downstreamCats)}</div>
    </div>`;
  }

  $("#catModalBody").innerHTML = html;

  $$("[data-mtab]", $("#catModalNav")).forEach(b=>b.onclick=()=>{
    S.modalScopeTab = b.dataset.mtab;
    renderCatModal();
  });

  if($("#mFacId")) $("#mFacId").oninput = e=>{ f.id = e.target.value; save(); };
  if($("#mFacName")) $("#mFacName").oninput = e=>{ f.name = e.target.value; save(); };
  if($("#mFacCountry")) $("#mFacCountry").onchange = e=>{ f.country = e.target.value; save(); };
  if($("#mFacGrid")) $("#mFacGrid").onchange = e=>{ f.grid = e.target.value; save(); };
  if($("#mFacEquity")) $("#mFacEquity").oninput = e=>{ f.equity = e.target.value; save(); };
  if($("#mFacCtrl")) $("#mFacCtrl").onchange = e=>{
    if(t.approach==="Operational Control") f.op = e.target.value; else f.fin = e.target.value;
    save();
  };

  $$("input[data-scope]", $("#catModalBody")).forEach(chk=>{
    chk.onchange = ()=>{
      const key = chk.dataset.scope;
      const arr = new Set(f[key]||[]);
      if(chk.checked) arr.add(chk.value); else arr.delete(chk.value);
      f[key] = Array.from(arr);
      f.s1 = f.s1Cats.length > 0;
      f.s2 = f.s2Cats.length > 0;
      f.s3 = f.s3Cats.length > 0;
      save();
      renderCatModal();
    };
  });

  $$("select[data-cmethod]", $("#catModalBody")).forEach(sel=>{
    sel.onchange = ()=>{
      f.catMethods[sel.dataset.cmethod] = sel.value;
      save();
    };
  });

  if($("#modalS2Method")) $("#modalS2Method").onchange = e=>{ f.s2Method = e.target.value; save(); renderCatModal(); };
  if($("#s1All")) $("#s1All").onclick = ()=>{ f.s1Cats = GHG_CATEGORIES.scope1.map(x=>x.id); f.s1 = true; save(); renderCatModal(); };
  if($("#s1Clear")) $("#s1Clear").onclick = ()=>{ f.s1Cats = []; f.s1 = false; save(); renderCatModal(); };
  if($("#s3All")) $("#s3All").onclick = ()=>{ f.s3Cats = GHG_CATEGORIES.scope3.map(x=>x.id); f.s3 = true; save(); renderCatModal(); };
  if($("#s3Clear")) $("#s3Clear").onclick = ()=>{ f.s3Cats = []; f.s3 = false; save(); renderCatModal(); };
}
$("#closeCatModal").onclick = ()=>{ $("#catModal").hidden = true; render(); };
$("#saveCatModal").onclick = ()=>{
  const t = activeTenant();
  const f = t.facilities[modalFacIdx];
  if(f) f.id = normId(f.id);
  $("#catModal").hidden = true;
  save();
  render();
  toast("Facility & GHG Protocol category selections saved.");
};

  if($("#addUserBtn")){
    $("#addUserBtn").onclick = ()=>{
      const name = $("#uName").value.trim();
      const email = $("#uEmail").value.trim();
      const dept = $("#uDept").value.trim() || "Operations";
      if(!name || !email){ toast("Please enter both name and email."); return; }
      t.users.push({ id: "u_" + Date.now(), name, email, role: "Data Entry Operator", dept });
      save();
      render();
      toast("Data Entry Operator " + name + " added.");
    };
  }

  $$("[data-assign-self-fac]", box).forEach(b=>b.onclick=()=>{
    const f = t.facilities[Number(b.dataset.assignSelfFac)];
    f.catOperators = f.catOperators || {};
    getActiveCategoryIds(f).forEach(item=>{ f.catOperators[item.id] = SELF_ADMIN_ID; });
    save();
    render();
    toast(`Assigned all enabled categories on ${f.name} to ${t.tenantAdmin.name} (Tenant Admin).`);
  });

  $$("[data-assign-fac]", box).forEach(sel=>{
    sel.onchange = ()=>{
      const f = t.facilities[Number(sel.dataset.assignFac)];
      f.catOperators = f.catOperators || {};
      f.catOperators[sel.dataset.assignCat] = sel.value;
      save();
      render();
      toast("Category assignment updated.");
    };
  });

  $$("[data-open-op]", box).forEach(b=>b.onclick=()=>{
    S.activeOpUserId = b.dataset.openOp;
    setMode("operator");
  });

  $$("[data-del-u]", box).forEach(b=>b.onclick=()=>{
    const u = t.users[Number(b.dataset.delU)];
    if(confirm("Remove user " + u.name + "?")){
      t.facilities.forEach(f=>{
        if(f.catOperators){
          Object.keys(f.catOperators).forEach(cid=>{
            if(f.catOperators[cid] === u.id) f.catOperators[cid] = "";
          });
        }
      });
      t.users.splice(Number(b.dataset.delU), 1);
      save();
      render();
    }
  });
}

/* ---------- Tenant Sub-Tab 3: Tenant Admin Direct Facility Data Entry ---------- */
function renderTenantDataEntryTab(box, t, locked){
  if(!t.facilities.length){
    box.innerHTML = `<div class="empty"><b>No facilities configured yet</b>Add a facility in Tab 1 first before entering facility activity data.</div>`;
    return;
  }

  let fac = t.facilities.find(f=>f.id===S.activeFacilityId) || t.facilities[0];
  S.activeFacilityId = fac.id;

  const selfCats = getFacilityAssignedCatsForActor(fac, SELF_ADMIN_ID);
  const allFacilityCats = getActiveCategoryIds(fac);

  // Tenant Admin can fill data for categories assigned to themselves, or toggle to view/fill all enabled facility categories
  const showAllFacCats = S.adminShowAllCats === true;
  const activeCatItems = showAllFacCats ? allFacilityCats : (selfCats.length ? selfCats : allFacilityCats);

  const enabledCats = [];
  activeCatItems.forEach(item=>{
    if(item.scope === "S1"){
      const c = GHG_CATEGORIES.scope1.find(x=>x.id===item.id);
      if(c) enabledCats.push({scope:"S1", id:c.id, code:c.code, name:c.name, method:(fac.catMethods||{})[c.id]||"S1_FUEL"});
    } else if(item.scope === "S2"){
      const c = GHG_CATEGORIES.scope2.find(x=>x.id===item.id);
      if(c) enabledCats.push({scope:"S2", id:c.id, code:c.code, name:c.name, method:fac.s2Method||"S2_DUAL"});
    } else if(item.scope === "S3"){
      const c = GHG_CATEGORIES.scope3.find(x=>x.id===item.id);
      if(c) enabledCats.push({scope:"S3", id:c.id, code:c.code, name:c.name, method:(fac.catMethods||{})[c.id]||"S3_ACT"});
    }
  });

  if(!enabledCats.length){
    box.innerHTML = `<div class="empty"><b>No GHG categories enabled on ${esc(fac.name)}</b>Tick applicable Scope 1, 2, or 3 categories in Tab 1 first.</div>`;
    return;
  }

  let curCat = enabledCats.find(x=>`${x.scope}:${x.id}`===S.activeCatKey) || enabledCats[0];
  S.activeCatKey = `${curCat.scope}:${curCat.id}`;

  const facEntries = t.entries.filter(e=>e.facilityId===fac.id);
  const submitterLabel = `${t.tenantAdmin.name} (Tenant Admin)`;

  box.innerHTML = `
    <div class="infobar" style="margin-bottom:14px">
      <div>
        <b>Tenant Admin Facility Data Entry:</b> ${esc(t.tenantAdmin.name)} &bull;
        <b>Self-Assigned Categories on ${esc(fac.name)}:</b> ${selfCats.length} of ${allFacilityCats.length}
      </div>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <label class="chk" style="background:#fff">
          <input type="checkbox" id="taShowAllCatsChk" ${showAllFacCats?"checked":""}>
          <span>Show all ${allFacilityCats.length} facility categories (Admin Override)</span>
        </label>
        <select id="taDeFacSel" style="min-height:32px;padding:3px 8px;font-size:13px;width:auto">
          ${t.facilities.map(f=>`<option value="${f.id}" ${f.id===fac.id?"selected":""}>${esc(f.name)} (${esc(normId(f.id))})</option>`).join("")}
        </select>
      </div>
    </div>

    <div class="de-layout">
      <aside class="cat-nav">
        ${["S1","S2","S3"].map(sc=>{
          const items = enabledCats.filter(x=>x.scope===sc);
          if(!items.length) return "";
          const title = sc==="S1"?"Scope 1 Categories":sc==="S2"?"Scope 2 Categories":"Scope 3 Categories";
          return `<div class="cat-nav-group">
            <div class="cat-nav-title">${title}</div>
            ${items.map(it=>{
              const key = `${it.scope}:${it.id}`;
              const cnt = facEntries.filter(e=>e.catId===it.id).length;
              const assignee = actorNameById(t, (fac.catOperators||{})[it.id]);
              return `<button type="button" class="cat-nav-item ${key===S.activeCatKey?"active":""}" data-cat="${key}">
                <span><b>${it.code}:</b> ${esc(it.name)}<br><span class="hint">Assigned: ${esc(assignee)}</span></span>
                <span class="tag">${cnt}</span>
              </button>`;
            }).join("")}
          </div>`;
        }).join("")}
      </aside>

      <div>
        ${renderActivityEntryFormAndTable(fac, curCat, submitterLabel, facEntries, locked)}
      </div>
    </div>
  `;

  $("#taShowAllCatsChk").onchange = e=>{ S.adminShowAllCats = e.target.checked; save(); render(); };
  $("#taDeFacSel").onchange = e=>{ S.activeFacilityId = e.target.value; save(); render(); };
  $$("[data-cat]", box).forEach(b=>b.onclick=()=>{ S.activeCatKey = b.dataset.cat; save(); render(); });

  bindActivityEntryEvents(t, fac, curCat, submitterLabel, enabledCats, locked);
}

/* ---------- Tenant Sub-Tab 4: Consolidated GHG Summary & Lock ---------- */
function renderTenantReviewTab(box, t, k, locked){
  let s1Tot=0, s2LocTot=0, s2MktTot=0, s3Tot=0;
  const rows = t.facilities.map(f=>{
    const inc = inclusion(t, f) ?? 0;
    const fEntries = t.entries.filter(e=>e.facilityId===f.id);
    const s1 = fEntries.filter(e=>e.scope==="S1").reduce((a,b)=>a+b.tco2e,0) * inc;
    const s2L = fEntries.filter(e=>e.scope==="S2").reduce((a,b)=>a+b.tco2e,0) * inc;
    const s2M = fEntries.filter(e=>e.scope==="S2").reduce((a,b)=>a+(b.mktTco2e!=null?b.mktTco2e:b.tco2e),0) * inc;
    const s3 = fEntries.filter(e=>e.scope==="S3").reduce((a,b)=>a+b.tco2e,0);
    s1Tot += s1; s2LocTot += s2L; s2MktTot += s2M; s3Tot += s3;
    return {f, inc, s1, s2L, s2M, s3, totLoc: s1+s2L+s3};
  });

  box.innerHTML = `
    <h2>Consolidated GHG Inventory (${esc(t.approach)} Boundary)</h2>
    <p class="hint" style="font-size:13.5px;margin-bottom:16px">Scope 1 and Scope 2 totals are automatically scaled by each facility's inclusion share under <b>${esc(t.approach)}</b>.</p>

    <div class="kpi-strip">
      <div class="kpi-card"><div class="k-lbl">Scope 1 (Consolidated)</div><div class="k-val">${fmtNum(s1Tot)} tCO2e</div></div>
      <div class="kpi-card"><div class="k-lbl">Scope 2 (Location-Based)</div><div class="k-val">${fmtNum(s2LocTot)} tCO2e</div></div>
      <div class="kpi-card mkt"><div class="k-lbl">Scope 2 (Market-Based)</div><div class="k-val">${fmtNum(s2MktTot)} tCO2e</div></div>
      <div class="kpi-card"><div class="k-lbl">Scope 3 (Value Chain)</div><div class="k-val">${fmtNum(s3Tot)} tCO2e</div></div>
      <div class="kpi-card hi"><div class="k-lbl">Total Footprint (Loc-Based)</div><div class="k-val">${fmtNum(s1Tot+s2LocTot+s3Tot)} tCO2e</div></div>
    </div>

    <div class="tablewrap" style="margin-bottom:16px">
      <table>
        <thead>
          <tr>
            <th>Facility</th>
            <th>Inclusion Share</th>
            <th>Scope 1 (tCO2e)</th>
            <th>Scope 2 Loc (tCO2e)</th>
            <th>Scope 2 Mkt (tCO2e)</th>
            <th>Scope 3 (tCO2e)</th>
            <th>Total (Loc-Based)</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r=>`<tr>
            <td><b>${esc(r.f.name)}</b><br><span class="hint">${esc(normId(r.f.id))}</span></td>
            <td class="pct">${esc(pctText(r.inc))}</td>
            <td>${fmtNum(r.s1)}</td>
            <td>${fmtNum(r.s2L)}</td>
            <td>${fmtNum(r.s2M)}</td>
            <td>${fmtNum(r.s3)}</td>
            <td><b>${fmtNum(r.totLoc)}</b></td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>

    <div class="tools">
      <button type="button" class="btn sec sm" id="exportJsonBtn">Download Complete Boundary &amp; Ledger (JSON)</button>
      <span style="flex:1"></span>
      <button type="button" class="btn" id="lockBoundaryBtn" ${(k.n>0 && k.issues===0 && !locked)?"":"disabled"}>
        ${locked ? "Boundary Approved & Locked" : "Approve & Lock Boundary v" + t.version}
      </button>
    </div>
  `;

  $("#exportJsonBtn").onclick = ()=>{
    const blob = new Blob([JSON.stringify(t, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `TulaCarbon_${t.name.replace(/[^A-Za-z0-9]+/g,"_")}_Inventory.json`;
    a.click();
  };
  $("#lockBoundaryBtn").onclick = ()=>{
    if(!confirm("Approve and lock boundary v" + t.version + " for " + t.name + "?")) return;
    t.lock = { version: t.version, at: new Date().toISOString(), by: t.tenantAdmin.name };
    save();
    render();
    toast("Boundary v" + t.version + " locked.");
  };
}

/* ==========================================================================

  if(!assignedFacs.length){
    v.innerHTML = `<section class="panel">
      <div class="infobar">
        <div><b>Logged in as Data Entry Operator:</b> ${esc(opUser.name)} (${esc(opUser.dept)}) &bull; <b>Organization:</b> ${esc(t.name)}</div>
        <div style="margin-left:auto">
          <select id="opSwitchUser" style="min-height:32px;padding:3px 8px;font-size:13px;width:auto">

      </div>

  let fac = assignedFacs.find(f=>f.id===S.activeFacilityId) || assignedFacs[0];
  S.activeFacilityId = fac.id;

  const assignedCatItems = getFacilityAssignedCatsForActor(fac, opUser.id);
  const enabledCats = [];
  assignedCatItems.forEach(item=>{
    if(item.scope === "S1"){
      const c = GHG_CATEGORIES.scope1.find(x=>x.id===item.id);
      if(c) enabledCats.push({scope:"S1", id:c.id, code:c.code, name:c.name, method:(fac.catMethods||{})[c.id]||"S1_FUEL"});
    } else if(item.scope === "S2"){
      const c = GHG_CATEGORIES.scope2.find(x=>x.id===item.id);
      if(c) enabledCats.push({scope:"S2", id:c.id, code:c.code, name:c.name, method:fac.s2Method||"S2_DUAL"});
    } else if(item.scope === "S3"){
      const c = GHG_CATEGORIES.scope3.find(x=>x.id===item.id);
      if(c) enabledCats.push({scope:"S3", id:c.id, code:c.code, name:c.name, method:(fac.catMethods||{})[c.id]||"S3_ACT"});
    }
  });

  let curCat = enabledCats.find(x=>`${x.scope}:${x.id}`===S.activeCatKey) || enabledCats[0];
  if(curCat) S.activeCatKey = `${curCat.scope}:${curCat.id}`;

  const facEntries = t.entries.filter(e=>e.facilityId===fac.id);
  const myEntriesCount = facEntries.filter(e=>e.enteredBy===opUser.name).length;
  const completedCatCount = enabledCats.filter(c=>facEntries.some(e=>e.catId===c.id)).length;
  const pendingCatCount = enabledCats.length - completedCatCount;

  v.innerHTML = `<section class="panel">
    <div class="infobar" style="background:var(--purple-soft);border-color:#C7B3DF;color:var(--purple)">
      <div>
        <b>My Assigned Work — Data Entry Operator:</b> ${esc(opUser.name)} (${esc(opUser.dept)}) &bull;
        <b>Organization:</b> ${esc(t.name)}
      </div>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <select id="opSwitchUser" aria-label="Switch Data Entry Operator" style="min-height:32px;padding:3px 8px;font-size:13px;width:auto">
          ${t.users.map(u=>`<option value="${u.id}" ${u.id===opUser.id?"selected":""}>Operator: ${esc(u.name)}</option>`).join("")}
        </select>
        <select id="opSwitchFac" aria-label="Select Assigned Facility" style="min-height:32px;padding:3px 8px;font-size:13px;width:auto">
          ${assignedFacs.map(f=>`<option value="${f.id}" ${f.id===fac.id?"selected":""}>${esc(f.name)} (${esc(normId(f.id))})</option>`).join("")}
        </select>
      </div>
    </div>

      <div class="kpi-card"><div class="k-lbl">Assigned GHG Categories</div><div class="k-val">${enabledCats.length} Categor${enabledCats.length===1?"y":"ies"}</div></div>
      <div class="kpi-card ${pendingCatCount>0?"mkt":"hi"}"><div class="k-lbl">Pending Categories</div><div class="k-val">${pendingCatCount} Remaining</div></div>
      <div class="kpi-card hi"><div class="k-lbl">My Submitted Records</div><div class="k-val">${myEntriesCount} Entries</div></div>
    </div>

    <div class="de-layout">
      <aside class="cat-nav">
        ${["S1","S2","S3"].map(sc=>{
          const items = enabledCats.filter(x=>x.scope===sc);
          if(!items.length) return "";
          const title = sc==="S1"?"Assigned Scope 1 Tasks":sc==="S2"?"Assigned Scope 2 Tasks":"Assigned Scope 3 Tasks";
          return `<div class="cat-nav-group">
            <div class="cat-nav-title">${title}</div>
            ${items.map(it=>{
              const key = `${it.scope}:${it.id}`;
              const cnt = facEntries.filter(e=>e.catId===it.id).length;
              return `<button type="button" class="cat-nav-item ${key===S.activeCatKey?"active":""}" data-cat="${key}">
                <span><b>${it.code}:</b> ${esc(it.name)}<br><span class="hint">${cnt>0?`${cnt} record${cnt===1?"":"s"} logged`:"Pending submission"}</span></span>
                <span class="tag ${cnt>0?"perm":""}">${cnt>0?"Done":"Pending"}</span>
              </button>`;
            }).join("")}
          </div>`;
        }).join("")}
      </aside>

      <div>
        ${renderActivityEntryFormAndTable(fac, curCat, opUser.name, facEntries, !!t.lock)}
      </div>
    </div>
  </section>`;

  $("#opSwitchUser").onchange = e=>{ S.activeOpUserId = e.target.value; save(); render(); };
  $("#opSwitchFac").onchange = e=>{ S.activeFacilityId = e.target.value; save(); render(); };
  $$("[data-cat]", v).forEach(b=>b.onclick=()=>{ S.activeCatKey = b.dataset.cat; save(); render(); });

  bindActivityEntryEvents(t, fac, curCat, opUser.name, enabledCats, !!t.lock);
}

        <div class="grid3">
          <div>
            <label class="f" for="deSuppEf">Supplier-Specific EF (kgCO2e / unit) *</label>
            <input type="number" id="deSuppEf" step="any" min="0" value="${defMeta.ef}" ${dis}>
          </div>
          <div>
            <label class="f" for="deSuppEfUnit">Supplier EF Denominator Unit *</label>
            <select id="deSuppEfUnit" ${dis}>
              ${ACTIVITY_UNITS.map(u=>`<option value="${u}" ${normUnit(u)===normUnit(defMeta.unit)?"selected":""}>kgCO2e / ${esc(u)}</option>`).join("")}
            </select>
          </div>
          <div>
            <label class="f" for="deSuppName">Supplier / Certificate Name</label>
            <input type="text" id="deSuppName" placeholder="e.g., Green PPA / Vendor PCF ID" ${dis}>
          </div>
        </div>
      </div>

      ${isDualS2 ? `
      <div style="margin-top:12px;max-width:340px">
        <label class="f" for="deMktEf">Market-Based Contractual EF (kgCO2e/kWh)<span class="hint">0.00 for 100% RECs/PPAs, or supplier residual mix</span></label>
        <input type="number" id="deMktEf" step="any" min="0" value="0.00" ${dis}>
      </div>` : ""}

      <div class="calc-preview">
        <div>
          <span class="hint" id="deSummarySub">Active EF Mode: Default / Tula AI Suggested</span>
          <div style="font-size:16px;font-weight:700;color:var(--teal-d)" id="dePreviewText">Ready to log activity record</div>
        </div>
        <button type="button" class="btn" id="deAddEntryBtn" ${dis}>+ Submit Activity Record</button>
      </div>

      <div class="dropzone">
        <div style="font-weight:600;margin-bottom:4px">Bulk Upload Template (Scoped to Enabled Categories)</div>
        <div class="hint" style="margin-bottom:10px">Includes <code>EF_Tier</code> (<code>default</code>, <code>site_calc</code>, or <code>supplier</code>), <code>Site_Density</code>, <code>Site_NCV</code>, and <code>Supplier_EF</code> columns.</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">
          <button type="button" class="btn sec sm" id="dlOpTplBtn">Download CSV Template</button>
          <label class="btn sec sm" style="cursor:pointer;margin:0">
            Upload Filled CSV <input type="file" id="uploadCsvInput" accept=".csv" hidden ${dis}>
          </label>
          <button type="button" class="btn sm" id="simUploadBtn" ${dis}>Simulate Sample CSV Upload</button>
        </div>
      </div>
    </div>

    <h3>Submitted Activity Records — ${esc(curCat.code)}: ${esc(curCat.name)} (${catEntries.length})</h3>
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>Activity Name</th>
            <th>Period Month</th>
            <th>Activity Data</th>
            <th>Applied EF &amp; Tier</th>
            <th>Evidence Source &amp; File</th>
            <th>Submitted By</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          ${!catEntries.length ? `<tr><td colspan="7" class="empty">No activity records submitted in this category yet.</td></tr>` :
            catEntries.map(e=>{
              const tierCls = e.efTier==="site_calc"?"site":e.efTier==="supplier"?"supp":"ai";
              return `<tr>
                <td><b>${esc(e.source)}</b></td>
                <td>${esc(e.period)}</td>
                <td><b>${Number(e.qty).toLocaleString()}</b> ${esc(e.unit)}</td>
                <td><b>${e.ef}</b> kgCO2e/${esc(e.efUnit||e.unit)}<br><span class="tag ${tierCls}">${esc(e.efSource||"Default / Tula AI")}</span></td>
                <td>
                  ${e.notes ? `<div>${esc(e.notes)}</div>` : ""}
                  ${e.evidenceFile ? `<button type="button" class="ev-link" data-dl-ev="${e.id}">&#128206; ${esc(e.evidenceFile.name)}</button>` : (!e.notes ? `<span class="hint">—</span>` : "")}
                </td>
                <td>${esc(e.enteredBy)}</td>
                <td><button type="button" class="iconbtn" data-del-entry="${e.id}" title="Delete record" ${dis}>&#10005;</button></td>
              </tr>`;
            }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function bindActivityEntryEvents(t, fac, curCat, submitterName, enabledCats, locked){
  const defMeta = getDefaultEfMeta(curCat.id, fac);
  const isDualS2 = curCat.scope==="S2" && curCat.method==="S2_DUAL";
  let pendingEvidenceFile = null;

  $("#deEvidenceFile").onchange = e=>{
    const file = e.target.files[0];
    if(!file){ pendingEvidenceFile = null; $("#deFileHint").textContent = "Attach invoice, meter log, or lab report"; return; }
    $("#deFileHint").textContent = `Attached: ${file.name} (${Math.max(1, Math.round(file.size/1024))} KB)`;
    const reader = new FileReader();
    reader.onload = ev=>{
      pendingEvidenceFile = {
        name: file.name,
        type: file.type || "application/octet-stream",
        size: file.size,
        dataUrl: file.size <= 1500000 ? ev.target.result : ""
      };
    };
    reader.readAsDataURL(file);
  };

  const getCurrentResolvedEf = ()=>{
    const tier = $("#deEfTier").value;
    return computeEffectiveEF(tier, curCat.id, fac, {
      density: $("#deSiteDensity").value,
      ncv: $("#deSiteNcv").value,
      supplierEf: $("#deSuppEf").value,
      supplierEfUnit: $("#deSuppEfUnit").value,
      supplierName: $("#deSuppName").value.trim()
    });
  };

  const refreshCalcState = ()=>{
    const tier = $("#deEfTier").value;
    $("#tierDefaultBox").hidden  = (tier !== "default");
    $("#tierSiteCalcBox").hidden = (tier !== "site_calc");
    $("#tierSupplierBox").hidden = (tier !== "supplier");

    const res = getCurrentResolvedEf();
    if(tier === "site_calc"){
      $("#deSiteCalcPreview").value = `${res.ef} kgCO2e/${res.unit} (${res.sourceTag})`;
    }

    const actUnit = $("#deUnit").value;
    const match = resolveUnitMatch(actUnit, res.unit);
    const badge = $("#deUnitMatchBadge");
    if(badge){
      badge.className = "tag " + (match.status==="exact"?"match-ok":match.status==="converted"?"match-warn":"match-bad");
      badge.textContent = match.label;
    }

    const q = Number($("#deQty").value)||0;
    $("#deSummarySub").textContent = `${res.sourceTag}: ${res.detail}`;
    if(match.status === "mismatch"){
      $("#dePreviewText").textContent = `Unit Mismatch: Activity (${actUnit}) vs EF (kgCO2e/${res.unit})`;
    } else if(q > 0){
      const tco2e = (q * match.factor * res.ef) / 1000;
      $("#dePreviewText").textContent = `${q.toLocaleString()} ${actUnit} × ${res.ef} kgCO2e/${res.unit} = ${fmtNum(tco2e)} tCO2e`;
    } else {
      $("#dePreviewText").textContent = `Effective EF: ${res.ef} kgCO2e/${res.unit}`;
    }
  };

  $("#deEfTier").onchange = refreshCalcState;
  $("#deUnit").onchange = refreshCalcState;
  $("#deQty").oninput = refreshCalcState;
  $("#deSiteDensity").oninput = refreshCalcState;
  $("#deSiteNcv").oninput = refreshCalcState;
  $("#deSuppEf").oninput = refreshCalcState;
  $("#deSuppEfUnit").onchange = refreshCalcState;
  $("#deSuppName").oninput = refreshCalcState;
  refreshCalcState();

  $("#deAddEntryBtn").onclick = ()=>{
    if(locked) return;
    const src = $("#deSource").value.trim();
    if(!src){ toast("Please enter an Activity Name."); return; }
    const qty = Number($("#deQty").value);
    if(!qty || qty <= 0){ toast("Enter valid Activity Data greater than 0."); return; }

    const tier = $("#deEfTier").value;
    const res = getCurrentResolvedEf();
    const actUnit = $("#deUnit").value;
    const match = resolveUnitMatch(actUnit, res.unit);

    if(match.status === "mismatch"){
      toast(`Cannot submit: Activity Data unit (${actUnit}) does not match EF unit (kgCO2e/${res.unit}).`);
      return;
    }

    const convertedQty = qty * match.factor;
    const locT = (convertedQty * res.ef) / 1000;
    const mktEf = isDualS2 ? (Number($("#deMktEf").value)||0) : null;
    const mktT = isDualS2 ? (convertedQty * mktEf) / 1000 : null;

    t.entries.push({
      id: "E-" + Date.now(),
      facilityId: fac.id,
      scope: curCat.scope,
      catId: curCat.id,
      method: curCat.method,
      source: src,
      period: $("#dePeriod").value,
      qty,
      unit: actUnit,
      efUnit: res.unit,
      unitMatch: match.label,
      ef: res.ef,
      efTier: tier,
      efSource: res.sourceTag,
      mktEf,
      tco2e: locT,
      mktTco2e: mktT,
      enteredBy: submitterName,
      notes: $("#deNotes").value.trim(),
      evidenceFile: pendingEvidenceFile
    });
    save();
    render();
    toast(`Submitted "${src}" (${res.sourceTag}).`);
  };

  $$("[data-dl-ev]").forEach(b=>b.onclick=()=>openEvidenceFile(t, b.dataset.dlEv));
  $$("[data-del-entry]").forEach(b=>b.onclick=()=>{
    t.entries = t.entries.filter(x=>x.id!==b.dataset.delEntry);
    save();
    render();
  });

  $("#dlOpTplBtn").onclick = ()=>{
    const headers = [
      "Facility_ID","Scope","Category_ID","Category_Name",
      "Activity_Name","Period_Month","Activity_Data","Activity_Data_Units",
      "EF_Tier","Site_Density","Site_NCV","Supplier_EF","Emission_Factor_Units","Evidence_Source"
    ];
    const sampleRows = enabledCats.map(c=>{
      const m = getDefaultEfMeta(c.id, fac);
      return [
        fac.id, c.scope, c.id, `"${c.name}"`,
        `"${c.code} Monthly Activity"`, "2025-04 (Apr 2025)", 1000, m.unit,
        "default", "", "", "", m.unit, `"Meter / Invoice Ref"`
      ];
    });
    const csv = "\uFEFF" + [headers].concat(sampleRows).map(r=>r.join(",")).join("\r\n");
    const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `TulaCarbon_${normId(fac.id)}_Activity_Template.csv`;
    a.click();
  };

  $("#uploadCsvInput").onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      const lines = String(ev.target.result).split(/\r?\n/).filter(Boolean);
      let imported = 0, skipped = 0;
      const allowedSet = new Set(enabledCats.map(x=>x.id));
      for(let i=1; i<lines.length; i++){
        const cols = lines[i].split(",").map(s=>s.replace(/^"|"$/g,"").trim());
        if(cols.length < 8) continue;
        const [, sc, catId, , actName, perMonth, qtyStr, actUnit, efTierRaw, densStr, ncvStr, suppEfStr, efUnitRaw, evSrc] = cols;
        if(!allowedSet.has(catId)){ skipped++; continue; }
        const qty = Number(qtyStr);
        if(!qty || qty <= 0){ skipped++; continue; }

        const tier = ["default","site_calc","supplier"].includes((efTierRaw||"").toLowerCase()) ? efTierRaw.toLowerCase() : "default";
        const res = computeEffectiveEF(tier, catId, fac, {
          density: densStr,
          ncv: ncvStr,
          supplierEf: suppEfStr,
          supplierEfUnit: efUnitRaw || actUnit
        });

        const match = resolveUnitMatch(actUnit, res.unit);
        if(match.status === "mismatch"){ skipped++; continue; }

        const convertedQty = qty * match.factor;
        t.entries.push({
          id: "E-" + Date.now() + "_" + i,
          facilityId: fac.id,
          scope: sc || (catId.startsWith("S1")?"S1":catId.startsWith("S2")?"S2":"S3"),
          catId,
          method: curCat.method,
          source: actName || "CSV Imported Activity",
          period: perMonth || "2025-04 (Apr 2025)",
          qty,
          unit: actUnit,
          efUnit: res.unit,
          unitMatch: match.label,
          ef: res.ef,
          efTier: tier,
          efSource: res.sourceTag,
          mktEf: null,
          tco2e: (convertedQty * res.ef)/1000,
          mktTco2e: null,
          enteredBy: submitterName,
          notes: evSrc || "Bulk CSV Upload",
          evidenceFile: { name: file.name, type: "text/csv", size: file.size, dataUrl: "" }
        });
        imported++;
      }
      save();
      render();
      toast(`Imported ${imported} records${skipped?` (${skipped} skipped due to unassigned category or unit mismatch)`:""}.`);
    };
    reader.readAsText(file);
  };

  $("#simUploadBtn").onclick = ()=>{
    t.entries.push({
      id: "E-SIM-" + Date.now(),
      facilityId: fac.id,
      scope: curCat.scope,
      catId: curCat.id,
      method: curCat.method,
      source: `${curCat.code} Monthly Log (Bulk CSV)`,
      period: "2025-05 (May 2025)",
      qty: 2500,
      unit: defMeta.unit,
      efUnit: defMeta.unit,
      unitMatch: `Exact Match (${defMeta.unit} = kgCO2e/${defMeta.unit})`,
      ef: defMeta.ef,
      efTier: "default",
      efSource: "Default / Tula AI Suggested",
      mktEf: isDualS2 ? 0.0 : null,
      tco2e: (2500 * defMeta.ef)/1000,
      mktTco2e: isDualS2 ? 0.0 : null,
      enteredBy: submitterName,
      notes: "Simulated bulk template upload",
      evidenceFile: { name: `Bulk_Upload_${curCat.code.replace(/\s+/g,"_")}_May2025.csv`, type: "text/csv", size: 640, dataUrl: "" }
    });
    save();
    render();
    toast("Simulated CSV row imported into " + curCat.code + ".");
  };
}

render();
</script>
</body>
</html>
